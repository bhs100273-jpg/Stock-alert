name: 주식 시세 자동 업데이트

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 주가 조회
        run: python update_stocks.py

      - name: 최신 데이터 저장
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "주가 데이터 업데이트"
          git push
